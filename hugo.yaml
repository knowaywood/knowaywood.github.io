params:
  title: "Peilong Lee"
  description: Personal website of Peilong Lee
  # staticPath: ""  # The path to serve the static files from
  favicon: "/fav.png"

  # Whether to serve bootstrap css and js files from CDN or not. Can be set to true, "css" or "js" to choose between
  # serving both, only the css, or only the js files through the CDN. Any other value will make so that CDN is not used.
  # Note the lack of "" in true, it should be of boolean type.
  useBootstrapCDN: false

  # If you want to load dynamically responsive images from Cloudinary
  # This requires your images to be uploaded + hosted on Cloudinary
  # Uncomment and change YOUR_CLOUD_NAME to the Cloud Name in your Cloudinary console
  # cloudinary_cloud_name: "YOUR_CLOUD_NAME"

  # Whether to add mathjax support on all pages. Alternatively, you can opt-in per page by adding `mathjax: true` in the frontmatter.
  mathjax: false

  # Whether the fade animations on the home page will be enabled
  animate: true

  theme:
    # disableThemeToggle: true
    # defaultTheme: "light" # dark

  font:
    fontSize: 1rem # default: 1rem
    fontWeight: 400 # default: 400
    lineHeight: 1.5 # default: 1.5
    textAlign: left # default: left

  # color preference
  # When using hex codes for colors, quotations must be used along with the # sign
  # color:
  #   textColor: "#343a40"
  #   secondaryTextColor: "#6c757d"
  #   textLinkColor: "#007bff"
  #   backgroundColor: "#eaedf0"
  #   secondaryBackgroundColor: "#64ffda1a"
  #   primaryColor: "#007bff"
  #   secondaryColor: "#f8f9fa"

  #   darkmode:
  #     textColor: "#e4e6eb"
  #     secondaryTextColor: "#b0b3b8"
  #     textLinkColor: "#ffffff"
  #     backgroundColor: "#18191a"
  #     secondaryBackgroundColor: "#212529"
  #     primaryColor: "#ffffff"
  #     secondaryColor: "#212529"

  # If you want to customize the menu, you can change it here
  navbar:
    align: ms-auto # Left: ms-auto | center: mx-auto | right: me-auto | Default: ms-auto
    # brandLogo: "/logo.png" # Logo for the brand | default is the favicon variable
    showBrandLogo: false # Show brand logo in nav bar | default is true
    brandName: "Peilong Lee" # Brand name for the brand | default is the title variable
    disableSearch: false
    # searchPlaceholder: "Search"
    stickyNavBar:
      enable : true
      showOnScrollUp : true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: false

  # Hero
  hero:
    enable: true
    intro: "Hi, my name is"
    title: "Peilong Lee"
    subtitle: "I work on AI for formal mathematics"
    content: "A mathematics student and AI builder focused on theorem proving, formal reasoning, and dependable intelligent systems."
    image: /images/me.jpg
    bottomImage:
      enable: true
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/knowaywood

  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/me.jpg"
    content: |-
      I am a mathematics student who enjoys connecting rigorous theory with practical AI systems. My work focuses on theorem proving, formal reasoning, and building reliable tools for mathematical problem solving.

      I am especially interested in theorem proving, neural-symbolic reasoning, RAG systems, and trustworthy AI for mathematical reasoning.
    skills:
      enable: true
      title: "Here are a few technologies I've been working with:"
      items:
        - "Python"
        - "Lean"
        - "PyTorch"
        - "LangChain"
        - "MCP"
        - "RAG"

  # Experience
  experience:
    enable: true
    # title: "Custom Name"
    items:
      - company: "LordInnov Academy Limited"
        companyUrl: "https://www.ltddir.com/companies/lordinnov-academy-limited/"
        jobs:
          - name: "Panorama Engineer"
            date: "Aug 2024 - Sep 2024"
            info:
              content: Developed core features for a VR panorama presentation system.
            content: |
              Responsible for core feature development for a VR panorama presentation system, including panoramic image stitching optimization, 3D interactive interface design, and multimedia feature integration.

              - Designed and implemented 3D scene transition effects and a visual editor based on Pannellum, with support for drag-and-drop hotspot customization and roaming path design.
              - Built a modular audio playback component and optimized memory usage in mobile browsers to keep high-resolution panorama experiences smooth.

  # Education
  education:
    enable: true
    # title: "Custom Name"
    index: false
    items:
      - title: "Bachelor of Science in Mathematics"
        school:
          name: "Hunan University"
          url: "https://www.hnu.edu.cn/"
        date: "2023 - 2027"
        GPA: "3.48 out of 4.0"
        content: |-
          Major coursework: Mathematical Analysis, Advanced Algebra, Probability and Statistics, Abstract Algebra, Real Analysis, Complex Analysis, Numerical Analysis, Numerical Optimization, Multivariate Statistical Analysis, and Ordinary Differential Equations.
        featuredLink:
          enable: false
          name: "Academic Record"
          url: ""

  # Achievements
  achievements:
    enable: true
    items:
      - title: First Prize, Hunan Province
        content: Awarded First Prize in the 2024 National College Students Mathematics Competition, Hunan Province division.
        image: /images/achievement.jpg
      - title: National Encouragement Scholarship
        content: Recipient of the 2024 National Encouragement Scholarship.
        image: /images/achievement.jpg

  # projects
  projects:
    enable: true
    # title: "Custom Name"
    items:
      - title: lean2graph
        content: An early-stage Lean and Python project exploring how Lean-related structures can be represented and visualized as graphs. Based on the current public repo, it is still in a scaffold phase, with Lean files, a Python package, and Graphviz already wired in.
        image: /images/projects/profile.png
        featured:
          name: GitHub
          link: https://github.com/knowaywood/lean2graph
        badges:
          - "Lean"
          - "Graph"
          - "Graphviz"
        links:
          - icon: fab fa-github
            url: https://github.com/knowaywood/lean2graph

      - title: overview
        content: An AI-assisted research workflow project built around LangGraph and related tooling. Its current README focuses on PDF-to-Markdown OCR, arXiv search, paper metadata extraction, paper structure analysis, and graph visualization for compiled agent workflows.
        image: /images/projects/converter.jpg
        featured:
          name: GitHub
          link: https://github.com/knowaywood/overview
        badges:
          - "LangGraph"
          - "OCR"
          - "Research"
        links:
          - icon: fab fa-github
            url: https://github.com/knowaywood/overview

      - title: Modern Python Docs
        content: A documentation project and practical guide to modern Python development. The published docs cover project setup, testing, linting, typing, documentation.
        image: /images/projects/profile2.jpg
        featured:
          name: Read Online
          link: http://modern-python-docs.readthedocs.io/
        badges:
          - "Python"
          - "Documentation"
          - "Book"
        links:
          - icon: fa fa-book
            url: http://modern-python-docs.readthedocs.io/

  #Contact
  contact:
    enable: true
    # title: "Custom Name"
    content: Feel free to reach out if you'd like to discuss mathematics, theorem proving, Lean, or AI systems.
    btnName: Mail me
    btnLink: mailto:knowaywood@outlook.com
    # formspree:
    #   enable: true # `contact.email` value will be ignored
    #   formId: abcdefgh # Take it from your form's endpoint, like 'https://formspree.io/f/abcdefgh'
    #   emailCaption: "Enter your email address"
    #   messageCaption: "Enter your message here"
    #   messageRows: 5

  # List pages like blogs and posts
  listPages:
    disableFeaturedImage: false

  # Single pages like blog and post
  singlePages:
    socialShare: true
    readTime:
      enable: true
      content: "min read"
    scrollprogress:
      enable: true
    tags:
      openInNewTab: true

  # For translations
  terms:
    read: "Read"
    toc: "Table Of Contents"
    copyright: "All rights reserved"
    emailText: "Check out this site"

  datesFormat:
    article: "Jan 2, 2006"
    articleList: "Jan 2, 2006"
    articleRecent: "Jan 2, 2006"

  #customScripts: -| # You can add custom scripts which will be added before </body> tag
  #  <script type="text/javascript"><!-- any script here --></script>
