baseURL: "https://knowaywood.github.io/"
languageCode: "en-us"
title: "knowaywood"
theme: hugo-profile

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

#services:
