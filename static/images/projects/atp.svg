  <g fill="#f8fafc" font-family="Georgia, serif">
    <text x="120" y="584" font-size="82" font-weight="700">ATP</text>
    <text x="356" y="584" font-size="30" opacity="0.92">LLM-guided theorem proving for Lean</text>
  </g>

  <rect x="874" y="126" width="178" height="114" rx="24" fill="url(#card)" opacity="0.96"/>
  <g stroke="#0f766e" stroke-width="6" fill="none" stroke-linecap="round">
