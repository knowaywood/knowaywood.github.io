    <text x="472" y="214">⊢</text>
    <text x="791" y="241">λ</text>
    <text x="542" y="374">?</text>
    <text x="854" y="430">✓</text>
    <text x="766" y="378">→</text>
    <text x="306" y="448">∃</text>
    <text x="214" y="372">×</text>
